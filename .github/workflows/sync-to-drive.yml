name: Sync to Google Drive

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate and Upload to Google Drive
        uses: satackey/action-google-drive@v2
        with:
          kadet-key: ${{ secrets.GOOGLE_CREDENTIALS }}
          folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          files: |
            ./**
